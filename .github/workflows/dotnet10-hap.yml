name: .NET 10 HarmonyOS HAP acceptance

on:
  push:
    branches: [openharmony/dotnet10-api26-sample]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  source-contract:
    name: Sample and dependency contract
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Verify API profiles and pinned submodules
        shell: pwsh
        run: |
          foreach ($api in 15, 18, 20, 23, 26) {
            [xml]$profile = Get-Content "Src/Entry/Properties/PublishProfiles/PublishApi$api.pubxml" -Raw
            if ($profile.Project.PropertyGroup.OpenHarmonyApiLevel -ne "$api") { throw "PublishApi$api does not select API $api." }
          }
          $profile = Get-Content OHOS_Project/build-profile.json5 -Raw
          if ($profile -notmatch 'compatibleSdkVersion"\s*:\s*"5\.0\.3\(15\)"') { throw 'HAP minimum API is not 15.' }
          if ((git rev-parse HEAD:ThirdParty/OpenHarmony.NDK.Bindings) -ne '2b68d3c1a3b3e1f5f8eabe1cfe0eae6348a55ce3') { throw 'Bindings submodule is not pinned to the accepted commit.' }
          if ((git rev-parse HEAD:ThirdParty/OpenHarmony.NET.Runtime) -ne 'ee65d551e72d5d45610df97d9aa88a994062371a') { throw 'Runtime package submodule is not pinned to the accepted commit.' }
          if ((git rev-parse HEAD:ThirdParty/PublishAotCross) -ne '94e69fb8e98d3b4c5ee126392081f5e8f44c34ad') { throw 'PublishAotCross submodule is not pinned to the accepted commit.' }
          git diff --check
      - name: Verify device acceptance contract
        shell: powershell
        run: |
          Import-Module Pester -ErrorAction Stop
          Invoke-Pester -Path ./tools/run-device-acceptance.Tests.ps1 -EnableExit

  host-publish:
    name: Publish API${{ matrix.api }} ${{ matrix.abi }}
    needs: source-contract
    runs-on: [self-hosted, Windows, harmonyos-sdk, runtime-artifacts]
    strategy:
      fail-fast: false
      matrix:
        api: [15, 18, 20, 23, 26]
        abi: [arm64-v8a, x86_64]
    steps:
      - name: Initialize host publish evidence
        shell: pwsh
        run: |
          $evidenceRoot = Join-Path $env:RUNNER_TEMP 'host-publish-evidence-api${{ matrix.api }}-${{ matrix.abi }}'
          New-Item -ItemType Directory -Path $evidenceRoot -Force | Out-Null
          $status = [ordered]@{ stage = 'host-publish'; status = 'initialized' }
          [IO.File]::WriteAllText(
            (Join-Path $evidenceRoot 'workflow-initialized.txt'),
            (($status | ConvertTo-Json) + "`n"),
            [Text.UTF8Encoding]::new($false))
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: NativeAOT publish and stage HAP files
        shell: pwsh
        run: |
          $evidenceRoot = Join-Path $env:RUNNER_TEMP 'host-publish-evidence-api${{ matrix.api }}-${{ matrix.abi }}'
          try {
            $sdkRoot = if ($env:OPENHARMONY_SDK_ROOT) { $env:OPENHARMONY_SDK_ROOT } else { Join-Path $env:LOCALAPPDATA 'OpenHarmony\Sdk' }
          $runtimeRoot = $env:OPENHARMONY_RUNTIME_PACKAGE_ROOT
          if (-not $runtimeRoot -or -not (Test-Path -LiteralPath $runtimeRoot)) { throw 'OPENHARMONY_RUNTIME_PACKAGE_ROOT must point to 10.0.10-ohos.1.' }
          dotnet publish Src/Entry/Entry.csproj -p:PublishProfile=PublishApi${{ matrix.api }} -p:OpenHarmonyAbi=${{ matrix.abi }} -p:OpenHarmonyRuntimePackageRoot="$runtimeRoot" -p:OpenHarmonySdkRoot="$sdkRoot" --verbosity minimal
          if ($LASTEXITCODE -ne 0) { throw 'Sample NativeAOT publish failed.' }
          $entry = "OHOS_Project/entry/libs/${{ matrix.abi }}/Entry.so"
          $webRoot = "OHOS_Project/AppScope/resources/resfile/wwwroot/${{ matrix.abi }}"
          if (-not (Test-Path -LiteralPath $entry -PathType Leaf)) { throw "Missing $entry" }
          if (-not (Test-Path -LiteralPath "$webRoot/index.html" -PathType Leaf)) { throw "Missing $webRoot/index.html" }
          $readObject = Join-Path $sdkRoot '26.0.0\native\llvm\bin\llvm-readobj.exe'
          $header = (& $readObject --file-headers $entry) -join "`n"
          $expected = if ('${{ matrix.abi }}' -eq 'arm64-v8a') { 'elf64-littleaarch64' } else { 'elf64-x86-64' }
          if ($header -notmatch [regex]::Escape($expected)) { throw "Entry.so is not $expected." }
          $sdkFolder = if (${{ matrix.api }} -eq 26) { '26.0.0' } else { '${{ matrix.api }}' }
          $nativeRoot = Join-Path $sdkRoot "$sdkFolder/native"
          $cmake = Join-Path $nativeRoot 'build-tools/cmake/bin/cmake.exe'
          $ninja = Join-Path $nativeRoot 'build-tools/cmake/bin/ninja.exe'
          $cmakeBuild = Join-Path $env:RUNNER_TEMP "hap-wrapper-api${{ matrix.api }}-${{ matrix.abi }}"
          & $cmake -S OHOS_Project/entry/src/main/cpp -B $cmakeBuild -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_TOOLCHAIN_FILE=$(Join-Path $nativeRoot 'build/cmake/ohos.toolchain.cmake')" "-DCMAKE_MAKE_PROGRAM=$ninja" -DOHOS_ARCH=${{ matrix.abi }} -DOHOS_PLATFORM=OHOS -DOHOS_STL=c++_shared -DOHOS_COMPATIBLE_SDK_VERSION=${{ matrix.api }}
          if ($LASTEXITCODE -ne 0) { throw 'HAP native wrapper configure failed.' }
          & $cmake --build $cmakeBuild --config Release
          if ($LASTEXITCODE -ne 0) { throw 'HAP native wrapper build failed.' }
          $stage = "artifacts/hap-stage/${{ matrix.abi }}"
          New-Item -ItemType Directory -Force "$stage/entry/libs", "$stage/AppScope/resources/resfile/wwwroot" | Out-Null
          Copy-Item -LiteralPath "OHOS_Project/entry/libs/${{ matrix.abi }}" -Destination "$stage/entry/libs/${{ matrix.abi }}" -Recurse -Force
          Copy-Item -LiteralPath $webRoot -Destination "$stage/AppScope/resources/resfile/wwwroot/${{ matrix.abi }}" -Recurse -Force
          }
          catch {
            $failure = [ordered]@{
              stage = 'host-publish'
              exceptionType = $_.Exception.GetType().FullName
            }
            [IO.File]::WriteAllText(
              (Join-Path $evidenceRoot 'workflow-host-publish-failure.txt'),
              (($failure | ConvertTo-Json) + "`n"),
              [Text.UTF8Encoding]::new($false))
            throw
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-publish-status-api${{ matrix.api }}-${{ matrix.abi }}
          path: ${{ runner.temp }}/host-publish-evidence-api${{ matrix.api }}-${{ matrix.abi }}/workflow-*.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: sample-api${{ matrix.api }}-${{ matrix.abi }}
          path: artifacts/hap-stage/${{ matrix.abi }}

  device-acceptance:
    name: API26 ${{ matrix.abi }} runtime acceptance
    if: github.event_name == 'workflow_dispatch'
    needs: host-publish
    runs-on: [self-hosted, Windows, harmonyos-sdk, deveco, "${{ matrix.runner }}"]
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            runner: openharmony-arm64-device
          - abi: x86_64
            runner: openharmony-x86_64-emulator
    steps:
      - name: Initialize device acceptance evidence
        shell: pwsh
        run: |
          $evidenceRoot = Join-Path $env:RUNNER_TEMP 'device-evidence-api26-${{ matrix.abi }}'
          New-Item -ItemType Directory -Path $evidenceRoot -Force | Out-Null
          $status = [ordered]@{ stage = 'device-acceptance'; status = 'initialized' }
          [IO.File]::WriteAllText(
            (Join-Path $evidenceRoot 'workflow-initialized.txt'),
            (($status | ConvertTo-Json) + "`n"),
            [Text.UTF8Encoding]::new($false))
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: sample-api26-arm64-v8a
          path: OHOS_Project
      - uses: actions/download-artifact@v4
        with:
          name: sample-api26-x86_64
          path: OHOS_Project
      - name: Build signed universal debug HAP
        shell: pwsh
        env:
          HARMONYOS_SIGNING_CONFIG_JSON: ${{ secrets.HARMONYOS_SIGNING_CONFIG_JSON }}
        run: |
          $evidenceRoot = Join-Path $env:RUNNER_TEMP 'device-evidence-api26-${{ matrix.abi }}'
          New-Item -ItemType Directory -Path $evidenceRoot -Force | Out-Null
          try {
            if (-not $env:DEVECO_SDK_HOME -or -not (Test-Path -LiteralPath $env:DEVECO_SDK_HOME)) { throw 'DEVECO_SDK_HOME must point to the DevEco SDK parent directory.' }
          $sdkManifest = Join-Path $env:DEVECO_SDK_HOME 'default\sdk-pkg.json'
          if (-not (Test-Path -LiteralPath $sdkManifest)) { throw "DEVECO_SDK_HOME must be the DevEco SDK parent containing default\sdk-pkg.json; received '$env:DEVECO_SDK_HOME'." }
          foreach ($component in 'openharmony', 'hms') {
            if (-not (Test-Path -LiteralPath (Join-Path $env:DEVECO_SDK_HOME "default\$component"))) { throw ("DevEco SDK component '{0}' is missing under default." -f $component) }
          }
          $hvigor = if ($env:HVIGORW) { $env:HVIGORW } else { (Get-Command hvigorw -ErrorAction Stop).Source }
          $buildProfilePath = 'OHOS_Project/build-profile.json5'
          $originalBuildProfile = Get-Content -LiteralPath $buildProfilePath -Raw
          try {
            ./tools/configure-hap-signing.ps1 -SigningConfigJson $env:HARMONYOS_SIGNING_CONFIG_JSON -BuildProfilePath $buildProfilePath
            Push-Location OHOS_Project
            try {
              & $hvigor --mode module -p product=default -p module=entry@default -p buildMode=debug assembleHap --no-daemon
              if ($LASTEXITCODE -ne 0) { throw 'Hvigor HAP build failed.' }
            }
            finally { Pop-Location }
          }
          finally {
            [IO.File]::WriteAllText((Resolve-Path -LiteralPath $buildProfilePath).Path, $originalBuildProfile, [Text.UTF8Encoding]::new($false))
          }
            $hap = Get-ChildItem OHOS_Project/entry/build -Recurse -Filter '*-signed.hap' | Select-Object -First 1
            if (-not $hap) { throw 'A signed HAP is required for device acceptance.' }
            "SIGNED_HAP=$($hap.FullName)" >> $env:GITHUB_ENV
          }
          catch {
            $failure = [ordered]@{
              stage = 'build-signed-hap'
              exceptionType = $_.Exception.GetType().FullName
            }
            [IO.File]::WriteAllText(
              (Join-Path $evidenceRoot 'workflow-build-failure.txt'),
              (($failure | ConvertTo-Json) + "`n"),
              [Text.UTF8Encoding]::new($false))
            throw
          }
      - name: Install, launch and verify runtime smoke
        shell: pwsh
        run: |
          $evidenceRoot = Join-Path $env:RUNNER_TEMP 'device-evidence-api26-${{ matrix.abi }}'
          New-Item -ItemType Directory -Path $evidenceRoot -Force | Out-Null
          try {
            $hdc = if ($env:HDC) { $env:HDC } else { (Get-Command hdc -ErrorAction Stop).Source }
          $java = if ($env:JAVA_HOME) { Join-Path $env:JAVA_HOME 'bin\java.exe' } else { (Get-Command java -ErrorAction Stop).Source }
          $hapSignTool = Join-Path $env:DEVECO_SDK_HOME 'default\openharmony\toolchains\lib\hap-sign-tool.jar'
          if (-not (Test-Path -LiteralPath $hapSignTool -PathType Leaf)) { throw "HAP signing tool was not found: $hapSignTool" }
            ./tools/run-device-acceptance.ps1 -Abi '${{ matrix.abi }}' -HapPath $env:SIGNED_HAP -HdcPath $hdc -ApiLevel 26 -EvidenceRoot $evidenceRoot -JavaPath $java -HapSignToolPath $hapSignTool
          }
          catch {
            $failure = [ordered]@{
              stage = 'device-acceptance-setup'
              exceptionType = $_.Exception.GetType().FullName
            }
            [IO.File]::WriteAllText(
              (Join-Path $evidenceRoot 'workflow-device-acceptance-failure.txt'),
              (($failure | ConvertTo-Json) + "`n"),
              [Text.UTF8Encoding]::new($false))
            throw
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-evidence-api26-${{ matrix.abi }}
          path: |
            ${{ runner.temp }}/device-evidence-api26-${{ matrix.abi }}/*-evidence.json
            ${{ runner.temp }}/device-evidence-api26-${{ matrix.abi }}/*-hilog.txt
            ${{ runner.temp }}/device-evidence-api26-${{ matrix.abi }}/workflow-*.txt
          if-no-files-found: error
